# Save the DB on disk, using the BGSAVE command.
# Disabled for development to avoid permission issues
# Save the DB every 300 seconds (5 minutes) if at least 100 keys have changed
# save 300 100
save ""

# Disable automatic background saving on shutdown for development
# This avoids permission issues when stopping containers
stop-writes-on-bgsave-error no

# RDB compression
rdbcompression yes

# Checksum for RDB file
rdbchecksum yes

# RDB file name
dbfilename dump.rdb

# The directory where the database will be saved
dir /data

# Log level
loglevel notice

# Bind to all interfaces (container network only)
bind 0.0.0.0

# Protected mode - require password even on localhost
protected-mode yes

# TCP backlog
tcp-backlog 511

# TCP keepalive
tcp-keepalive 300

# Timeout for idle clients (0 to disable)
timeout 0

# Maximum number of connected clients
maxclients 10000

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Security: require password (set via environment or command line)
# requirepass will be set via command line: --requirepass ${REDIS_PASSWORD}

# Disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG ""
rename-command SHUTDOWN SHUTDOWN_RENAMED_FOR_ADMIN

# Append only file disabled for development to avoid permission issues
# In production, enable this and ensure proper permissions
appendonly no
# appendfilename "appendonly.aof"
# appendfsync everysec
# no-appendfsync-on-rewrite no

# Slow log for monitoring
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency monitoring
latency-monitor-threshold 100
