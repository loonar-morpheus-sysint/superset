  <!-- Wordmark -->
  <g font-family="Metropolis, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
     fill="#111827">
    <text x="52" y="28" font-size="22" font-weight="700" letter-spacing="0.2">Loonar</text>
    <text x="52" y="46" font-size="12" font-weight="500" fill="#4B5563" letter-spacing="2">FINOPS</text>
  </g>
</svg>
