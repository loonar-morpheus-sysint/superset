<?xml version="1.0" encoding="UTF-8"?>
<!--
  Loonar FinOps brand mark (HPE Morpheus inspired).
  Original design; does not reproduce HPE trademarks.
  Optimized for display at ~28px header height.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" role="img" aria-label="Loonar FinOps">
  <title>Loonar FinOps</title>
  <!-- Green accent element -->
